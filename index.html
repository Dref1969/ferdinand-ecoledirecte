<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferdinand · Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
  :root {
    --bg-0: #0E0E10;
    --bg-1: #18181B;
    --bg-2: #1F1F23;
    --bg-3: #2D2D33;
    --border: #3F3F47;
    --border-bright: #5A5A6A;
    --text: #EFEFF1;
    --text-dim: #ADADB8;
    --text-mute: #6E6E78;
    --violet: #9146FF;
    --violet-glow: #B084FF;
    --discord: #5865F2;
    --cyan: #00D9FF;
    --pink: #FF2E92;
    --green: #57F287;
    --red: #ED4245;
    --yellow: #FEE75C;
    --orange: #FF7A3D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg-0); }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(145, 70, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0, 217, 255, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255, 46, 146, 0.05) 0%, transparent 60%),
      var(--bg-0);
    background-attachment: fixed;
    position: relative;
  }

  /* Grid pattern subtle */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(145, 70, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(145, 70, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
  }

  /* Particles flottantes */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--violet-glow);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--violet-glow), 0 0 16px var(--violet);
    animation: floatUp 15s linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
  }

  /* Container */
  .wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 24px; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, rgba(31, 31, 35, 0.7) 0%, rgba(24, 24, 27, 0.7) 100%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    margin-bottom: 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 60%; height: 200%;
    background: linear-gradient(90deg, transparent, rgba(145, 70, 255, 0.15), transparent);
    transform: rotate(25deg);
    animation: shine 6s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 100% { transform: translateX(-100%) rotate(25deg); }
    50% { transform: translateX(200%) rotate(25deg); }
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
  }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(87, 242, 135, 0.15);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }
  .live-badge::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .date-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 96px;
    font-weight: 700;
    line-height: 0.95;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #FFFFFF 0%, #ADADB8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -3px;
    position: relative;
  }
  header h1 .accent {
    background: linear-gradient(135deg, var(--violet) 0%, var(--cyan) 50%, var(--pink) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(145, 70, 255, 0.5);
  }
  @media (max-width: 640px) { header h1 { font-size: 56px; letter-spacing: -2px; } }

  header .sub {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 12px;
  }
  header .sub .dot { color: var(--violet-glow); margin: 0 8px; }

  /* NAV */
  nav.tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px;
    margin-bottom: 28px;
    overflow-x: auto;
    backdrop-filter: blur(10px);
  }
  nav.tabs button {
    background: transparent;
    border: none;
    padding: 12px 24px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    border-radius: 10px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--text); background: var(--bg-2); }
  nav.tabs button.active {
    background: linear-gradient(135deg, var(--violet) 0%, var(--discord) 100%);
    color: white;
    box-shadow: 0 4px 20px rgba(145, 70, 255, 0.4);
  }

  main { padding-bottom: 60px; }
  .panel { display: none; animation: slideUp 0.4s ease; }
  .panel.active { display: block; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* KPI */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .kpi {
    background: linear-gradient(135deg, rgba(31, 31, 35, 0.8) 0%, rgba(24, 24, 27, 0.8) 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
  }
  .kpi:hover {
    transform: translateY(-3px);
    border-color: var(--violet);
    box-shadow: 0 12px 40px rgba(145, 70, 255, 0.25);
  }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .kpi.k1 { --accent: var(--red); }
  .kpi.k2 { --accent: var(--yellow); }
  .kpi.k3 { --accent: var(--green); }
  .kpi.k4 { --accent: var(--orange); }

  .kpi-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .kpi-val {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    letter-spacing: -2px;
  }
  .kpi-suffix {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 8px;
  }

  /* CARDS */
  .card {
    background: linear-gradient(135deg, rgba(31, 31, 35, 0.7) 0%, rgba(24, 24, 27, 0.7) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 12px;
    padding: 18px 22px;
    transition: all 0.25s ease;
    position: relative;
    backdrop-filter: blur(10px);
  }
  .card:hover {
    border-color: var(--border-bright);
    transform: translateX(2px);
  }
  .card.urgent {
    border-color: rgba(237, 66, 69, 0.5);
    background: linear-gradient(135deg, rgba(237, 66, 69, 0.08) 0%, rgba(24, 24, 27, 0.8) 60%);
  }
  .card.urgent::before {
    content: '';
    position: absolute;
    left: -1px; top: -1px; bottom: -1px;
    width: 4px;
    background: var(--red);
    box-shadow: 0 0 12px var(--red);
    border-radius: 16px 0 0 16px;
  }
  .card.important {
    border-color: rgba(254, 231, 92, 0.4);
  }
  .card.important::before {
    content: '';
    position: absolute;
    left: -1px; top: -1px; bottom: -1px;
    width: 4px;
    background: var(--yellow);
    box-shadow: 0 0 8px var(--yellow);
    border-radius: 16px 0 0 16px;
  }
  .card.fait {
    opacity: 0.5;
    border-color: rgba(87, 242, 135, 0.3);
  }
  .card.fait .contenu { text-decoration: line-through; color: var(--text-mute); }

  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .card-matiere {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
    letter-spacing: -0.3px;
  }
  .card-meta { text-align: right; }
  .card-date {
    font-family: 'JetBrains Mono', monospace;
    color: var(--cyan);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .card .contenu {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 6px;
    line-height: 1.5;
  }

  /* Checkbox */
  .check-fait {
    appearance: none;
    width: 22px; height: 22px;
    border: 2px solid var(--border-bright);
    background: var(--bg-1);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    border-radius: 6px;
    transition: all 0.2s ease;
    margin-top: 1px;
  }
  .check-fait:hover { border-color: var(--violet); background: rgba(145, 70, 255, 0.1); }
  .check-fait:checked {
    background: linear-gradient(135deg, var(--green) 0%, #3FBE6F 100%);
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(87, 242, 135, 0.5);
  }
  .check-fait:checked::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    color: var(--bg-0);
    font-size: 14px;
    font-weight: 900;
  }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin-top: 8px;
    border-radius: 6px;
    text-transform: uppercase;
  }
  .badge.urgent { background: rgba(237, 66, 69, 0.15); color: var(--red); border: 1px solid rgba(237, 66, 69, 0.4); }
  .badge.important { background: rgba(254, 231, 92, 0.12); color: var(--yellow); border: 1px solid rgba(254, 231, 92, 0.3); }
  .badge.normal { background: rgba(87, 242, 135, 0.12); color: var(--green); border: 1px solid rgba(87, 242, 135, 0.3); }
  .badge.demain { background: rgba(145, 70, 255, 0.15); color: var(--violet-glow); border: 1px solid rgba(145, 70, 255, 0.4); }

  /* Section title */
  .section-titre {
    display: flex;
    align-items: center;
    margin: 32px 0 16px;
    gap: 14px;
  }
  .section-titre h2 {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .section-titre h2::before {
    content: '> ';
    color: var(--violet);
    font-family: 'JetBrains Mono', monospace;
  }
  .section-titre .count {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-mute);
    font-size: 12px;
    padding: 2px 8px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .section-titre .ligne {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
  }

  /* EDT grille */
  .edt-grid {
    display: grid;
    grid-template-columns: 60px repeat(6, 1fr);
    gap: 3px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    margin-bottom: 20px;
    padding: 4px;
    overflow-x: auto;
  }
  .edt-cell {
    background: var(--bg-2);
    padding: 4px;
    min-height: 38px;
    position: relative;
    font-size: 11px;
    border-radius: 6px;
  }
  .edt-cell.head {
    background: var(--bg-3);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    padding: 10px 4px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .edt-cell.head.today {
    background: linear-gradient(135deg, var(--violet) 0%, var(--discord) 100%);
    color: white;
    box-shadow: 0 0 20px rgba(145, 70, 255, 0.4);
  }
  .edt-cell.heure {
    background: transparent;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 600;
  }
  .edt-cell.today {
    background: rgba(145, 70, 255, 0.08);
    border: 1px solid rgba(145, 70, 255, 0.2);
  }
  .cours {
    border-left: 3px solid var(--course-color, var(--violet));
    background: linear-gradient(90deg, rgba(145, 70, 255, 0.12) 0%, rgba(31, 31, 35, 0.5) 100%);
    border-radius: 6px;
    padding: 4px 6px;
    margin-bottom: 2px;
  }
  .cours .matiere { font-weight: 700; color: var(--text); font-size: 11px; line-height: 1.1; }
  .cours .prof { color: var(--text-dim); font-size: 9px; }
  .cours .salle { color: var(--cyan); font-size: 10px; font-weight: 600; font-family: 'JetBrains Mono'; }
  .cours .heure { color: var(--text-mute); font-size: 9px; font-family: 'JetBrains Mono'; }
  .cours.annule { opacity: 0.4; text-decoration: line-through; }

  /* Notes */
  .note-card {
    display: grid;
    grid-template-columns: 80px 1fr 130px;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, rgba(31, 31, 35, 0.7) 0%, rgba(24, 24, 27, 0.7) 100%);
    border: 1px solid var(--border);
    padding: 14px 22px;
    margin-bottom: 8px;
    border-radius: 12px;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
  }
  .note-card:hover { border-color: var(--border-bright); transform: translateX(2px); }
  .note-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--cyan); font-weight: 600; }
  .note-matiere { font-family: 'Space Grotesk'; color: var(--text); font-size: 16px; font-weight: 700; }
  .note-devoir { font-size: 12px; color: var(--text-mute); margin-top: 2px; }
  .note-valeur {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 32px;
    text-align: right;
    line-height: 1;
    letter-spacing: -1px;
  }
  .note-valeur.bonne { color: var(--green); text-shadow: 0 0 12px rgba(87, 242, 135, 0.4); }
  .note-valeur.moyenne { color: var(--yellow); text-shadow: 0 0 12px rgba(254, 231, 92, 0.3); }
  .note-valeur.basse { color: var(--red); text-shadow: 0 0 12px rgba(237, 66, 69, 0.4); }
  .note-valeur small { font-size: 16px; color: var(--text-mute); font-weight: 500; text-shadow: none; }

  /* Chart */
  .chart-container {
    background: linear-gradient(135deg, rgba(31, 31, 35, 0.8) 0%, rgba(24, 24, 27, 0.8) 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .chart-container h3 {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chart-container h3::before {
    content: '⚡';
    color: var(--violet-glow);
    text-shadow: 0 0 12px var(--violet);
  }

  /* Empty */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    border: 1px dashed var(--border);
    border-radius: 16px;
    background: var(--bg-1);
  }
  .empty .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }

  /* Loader */
  #loader {
    position: fixed;
    inset: 0;
    background: var(--bg-0);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.5s;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .spinner {
    width: 60px; height: 60px;
    border: 3px solid var(--bg-3);
    border-top-color: var(--violet);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 20px rgba(145, 70, 255, 0.4);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader .txt {
    font-family: 'JetBrains Mono', monospace;
    color: var(--violet-glow);
    font-size: 14px;
    letter-spacing: 4px;
    margin-top: 24px;
    text-transform: uppercase;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 24px;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    text-transform: uppercase;
  }

  .config-warn {
    background: rgba(254, 231, 92, 0.1);
    border: 1px solid rgba(254, 231, 92, 0.3);
    color: var(--yellow);
    padding: 16px;
    margin: 16px 0;
    text-align: center;
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .config-warn code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; }

  /* Scrollbar custom */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-1); }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--violet); }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div id="loader">
  <div class="spinner"></div>
  <div class="txt">CONNECTING...</div>
</div>

<div class="wrap">
  <header>
    <div class="header-top">
      <div class="live-badge">LIVE</div>
      <div class="date-badge" id="dateJour"></div>
    </div>
    <h1><span class="accent">Ferdinand</span><br>Dashboard</h1>
    <div class="sub">DEVOIRS <span class="dot">●</span> EDT <span class="dot">●</span> NOTES <span class="dot">●</span> PRIORITÉS</div>
  </header>

  <nav class="tabs">
    <button class="active" data-tab="devoirs">📚 Devoirs</button>
    <button data-tab="edt">🗓️ Emploi du temps</button>
    <button data-tab="priorites">🎯 Priorités</button>
    <button data-tab="notes">📊 Notes</button>
  </nav>

  <main>
    <div id="configWarn" class="config-warn" style="display:none;">
      ⚠️ Config requise : remplace <code>APPS_SCRIPT_URL</code> dans <code>index.html</code>.
    </div>

    <section class="panel active" id="panel-devoirs">
      <div class="kpi-grid" id="kpiDevoirs"></div>
      <div id="devoirsListe"></div>
    </section>

    <section class="panel" id="panel-edt">
      <div id="edtSemaine"></div>
    </section>

    <section class="panel" id="panel-priorites">
      <div id="prioritesListe"></div>
    </section>

    <section class="panel" id="panel-notes">
      <div class="chart-container">
        <h3>Niveaux par matière</h3>
        <canvas id="chartMoyennes" height="140"></canvas>
      </div>
      <div class="section-titre">
        <h2>Dernières notes</h2>
        <span class="ligne"></span>
      </div>
      <div id="notesListe"></div>
    </section>
  </main>

  <footer>
    SYNC <span style="color:var(--cyan)" id="lastUpdate">—</span> · BUILD v2 · DARK_MODE
  </footer>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxRJwRD46bN9IM-3fQsjGoekyLYaLeNohwabPc0l__z4Ocv5O7HeS418wE3FSqv4D2/exec";

let DATA = { devoirs: [], notes: [], edt: [], priorites: { moyennes: [], priorites: [] } };

function setDateJour() {
  const d = new Date();
  document.getElementById('dateJour').textContent = '> ' + d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
}

function spawnParticles() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDelay = (Math.random() * 15) + 's';
    p.style.animationDuration = (12 + Math.random() * 10) + 's';
    const colors = ['#B084FF', '#00D9FF', '#FF2E92'];
    p.style.background = colors[Math.floor(Math.random()*3)];
    p.style.boxShadow = `0 0 8px ${p.style.background}, 0 0 16px ${p.style.background}`;
    c.appendChild(p);
  }
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

async function loadData() {
  if (APPS_SCRIPT_URL.includes('REMPLACE_MOI')) {
    document.getElementById('configWarn').style.display = 'block';
    document.getElementById('loader').classList.add('done');
    return;
  }
  try {
    const r = await fetch(APPS_SCRIPT_URL + '?action=all&t=' + Date.now());
    DATA = await r.json();
    if (DATA.error) throw new Error(DATA.error);
    document.getElementById('lastUpdate').textContent = new Date(DATA.updated || Date.now()).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
    render();
  } catch (e) {
    document.querySelector('main').insertAdjacentHTML('afterbegin', `<div class="config-warn">Erreur : ${e.message}</div>`);
  } finally {
    setTimeout(() => document.getElementById('loader').classList.add('done'), 400);
  }
}

function render() { renderDevoirs(); renderEdt(); renderPriorites(); renderNotes(); renderChart(); }

function escapeHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtJour(d) { return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' }); }

/* ---- DEVOIRS ---- */
function renderDevoirs() {
  const liste = DATA.devoirs || [];
  const today = new Date(); today.setHours(0,0,0,0);
  const demain = new Date(today); demain.setDate(demain.getDate() + 1);
  const aFaire = liste.filter(d => !d.fait && new Date(d.date_remise) >= today);
  const pourDemain = liste.filter(d => { const dr = new Date(d.date_remise); dr.setHours(0,0,0,0); return dr.getTime() === demain.getTime(); });
  const faits = liste.filter(d => d.fait);
  const enRetard = liste.filter(d => !d.fait && new Date(d.date_remise) < today);

  document.getElementById('kpiDevoirs').innerHTML = `
    <div class="kpi k1"><div class="kpi-label">À faire</div><div class="kpi-val">${aFaire.length}</div><div class="kpi-suffix">devoirs en cours</div></div>
    <div class="kpi k2"><div class="kpi-label">Demain</div><div class="kpi-val">${pourDemain.length}</div><div class="kpi-suffix">à rendre</div></div>
    <div class="kpi k3"><div class="kpi-label">Faits</div><div class="kpi-val">${faits.length}</div><div class="kpi-suffix">complétés ✓</div></div>
    <div class="kpi k4"><div class="kpi-label">En retard</div><div class="kpi-val">${enRetard.length}</div><div class="kpi-suffix">à rattraper</div></div>`;

  if (liste.length === 0) {
    document.getElementById('devoirsListe').innerHTML = `<div class="empty"><div class="icon">📭</div>Aucun devoir en cours</div>`;
    return;
  }
  const groupes = {};
  liste.forEach(d => { (groupes[d.date_remise || 'x'] = groupes[d.date_remise || 'x'] || []).push(d); });
  const keys = Object.keys(groupes).sort();
  let html = '';
  keys.forEach(k => {
    const dd = new Date(k); dd.setHours(0,0,0,0);
    let lbl;
    if (dd.getTime() === today.getTime()) lbl = "Aujourd'hui";
    else if (dd.getTime() === demain.getTime()) lbl = "Demain";
    else if (dd < today) lbl = dd.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}) + ' (passé)';
    else lbl = dd.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
    html += `<div class="section-titre"><h2>${lbl}</h2><span class="count">${groupes[k].length}</span><span class="ligne"></span></div>`;
    groupes[k].forEach(d => html += cardDevoir(d, today, demain));
  });
  document.getElementById('devoirsListe').innerHTML = html;

  document.querySelectorAll('.check-fait').forEach(cb => {
    cb.addEventListener('change', async (e) => {
      const id = e.target.dataset.id;
      const fait = e.target.checked;
      const card = e.target.closest('.card');
      card.classList.toggle('fait', fait);
      try {
        await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action:'toggle_fait', id, fait}) });
        const d = DATA.devoirs.find(x => x.id === id); if (d) d.fait = fait;
        renderDevoirs();
      } catch (err) { alert('Erreur : ' + err.message); e.target.checked = !fait; }
    });
  });
}
function cardDevoir(d, today, demain) {
  const dr = new Date(d.date_remise); dr.setHours(0,0,0,0);
  const j = Math.ceil((dr - today) / 86400000);
  let cls = 'card';
  if (d.fait) cls += ' fait'; else if (j <= 0) cls += ' urgent'; else if (j === 1) cls += ' important';
  let badge = '';
  if (!d.fait) {
    if (j < 0) badge = `<span class="badge urgent">⚠ EN RETARD</span>`;
    else if (j === 0) badge = `<span class="badge urgent">● AUJOURD'HUI</span>`;
    else if (j === 1) badge = `<span class="badge demain">▸ DEMAIN</span>`;
    else if (j <= 3) badge = `<span class="badge important">▸ DANS ${j}J</span>`;
    else badge = `<span class="badge normal">▸ DANS ${j}J</span>`;
  }
  return `
    <div class="card ${cls}">
      <div class="card-head">
        <input type="checkbox" class="check-fait" data-id="${d.id}" ${d.fait ? 'checked' : ''}>
        <div style="flex:1">
          <div class="card-matiere">${escapeHtml(d.matiere || '?')}</div>
          ${badge}
        </div>
        <div class="card-meta"><div class="card-date">${fmtJour(dr)}</div></div>
      </div>
      <div class="contenu">${escapeHtml(d.contenu || '—')}</div>
    </div>`;
}

/* ---- EDT ---- */
function renderEdt() {
  const edt = DATA.edt || [];
  if (edt.length === 0) {
    document.getElementById('edtSemaine').innerHTML = `<div class="empty"><div class="icon">🗓️</div>Pas d'emploi du temps</div>`;
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay() || 7;
  const monday = new Date(today); monday.setDate(monday.getDate() - dow + 1);
  const jours = [];
  for (let i = 0; i < 6; i++) { const d = new Date(monday); d.setDate(d.getDate() + i); jours.push(d); }
  const coursParJour = {};
  edt.forEach(c => {
    if (!c.start) return;
    const dStr = String(c.start).substring(0, 10);
    if (!coursParJour[dStr]) coursParJour[dStr] = [];
    coursParJour[dStr].push(c);
  });
  Object.values(coursParJour).forEach(arr => arr.sort((a,b) => String(a.start).localeCompare(String(b.start))));
  const heures = [];
  for (let h = 8; h <= 17; h++) heures.push(h);

  let html = `<div class="section-titre"><h2>Semaine du ${fmtJour(monday)}</h2><span class="count">${edt.length} cours</span><span class="ligne"></span></div>`;
  html += `<div class="edt-grid">`;
  html += `<div class="edt-cell head">H</div>`;
  jours.forEach(j => {
    const isToday = j.getTime() === today.getTime();
    const lbl = j.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit' });
    html += `<div class="edt-cell head ${isToday?'today':''}">${lbl}</div>`;
  });
  heures.forEach(h => {
    html += `<div class="edt-cell heure">${h}h</div>`;
    jours.forEach(j => {
      const isToday = j.getTime() === today.getTime();
      const dStr = j.toISOString().substring(0, 10);
      const courses = (coursParJour[dStr] || []).filter(c => {
        const startH = parseInt(String(c.start).substring(11, 13), 10);
        return startH === h;
      });
      let cellHtml = '';
      courses.forEach(c => {
        const startTime = String(c.start).substring(11, 16);
        const endTime = String(c.end).substring(11, 16);
        const annule = c.annule === 'Oui';
        cellHtml += `<div class="cours ${annule ? 'annule' : ''}" style="--course-color:${pickCourseColor(c.couleur)}">
                       <div class="matiere">${escapeHtml((c.matiere || '').substring(0, 22))}</div>
                       <div class="heure">${startTime}-${endTime}</div>
                       ${c.prof ? `<div class="prof">${escapeHtml(String(c.prof).substring(0, 18))}</div>` : ''}
                       ${c.salle ? `<div class="salle">${escapeHtml(c.salle)}</div>` : ''}
                     </div>`;
      });
      html += `<div class="edt-cell${isToday ? ' today' : ''}">${cellHtml}</div>`;
    });
  });
  html += `</div>`;

  const dStrToday = today.toISOString().substring(0, 10);
  const aujourdhui = coursParJour[dStrToday] || [];
  if (aujourdhui.length > 0) {
    html += `<div class="section-titre"><h2>Aujourd'hui</h2><span class="count">${aujourdhui.length}</span><span class="ligne"></span></div>`;
    aujourdhui.forEach(c => {
      const startTime = String(c.start).substring(11, 16);
      const endTime = String(c.end).substring(11, 16);
      const annule = c.annule === 'Oui';
      const color = pickCourseColor(c.couleur);
      html += `<div class="card ${annule ? 'fait' : ''}" style="border-left: 3px solid ${color}; box-shadow: -1px 0 12px ${color}40;">
                 <div class="card-head">
                   <div style="flex:1">
                     <div class="card-matiere">${escapeHtml(c.matiere || '')} ${annule ? '<span style="color:var(--red); font-size:11px; font-family: JetBrains Mono;">⚠ ANNULÉ</span>' : ''}</div>
                     <div style="color:var(--text-dim); font-size:13px; margin-top:4px;">${c.prof || ''}${c.salle ? ' · <span style="color:var(--cyan); font-family: JetBrains Mono;">📍 ' + c.salle + '</span>' : ''}</div>
                   </div>
                   <div class="card-meta"><div class="card-date">${startTime}<br>${endTime}</div></div>
                 </div>
               </div>`;
    });
  }
  document.getElementById('edtSemaine').innerHTML = html;
}
function pickCourseColor(c) {
  if (!c) return '#9146FF';
  const palette = ['#9146FF', '#00D9FF', '#FF2E92', '#57F287', '#FEE75C', '#FF7A3D', '#5865F2', '#ED4245'];
  let h = 0; for (let i = 0; i < c.length; i++) h = (h*31 + c.charCodeAt(i)) | 0;
  return palette[Math.abs(h) % palette.length];
}

/* ---- PRIORITES ---- */
function renderPriorites() {
  const prio = (DATA.priorites && DATA.priorites.priorites) || [];
  if (prio.length === 0) {
    document.getElementById('prioritesListe').innerHTML = `<div class="empty"><div class="icon">🎯</div>Tous les devoirs sont faits — GG !</div>`;
    return;
  }
  const urg = prio.filter(p => p.niveau === 'URGENT');
  const imp = prio.filter(p => p.niveau === 'IMPORTANT');
  const nor = prio.filter(p => p.niveau === 'NORMAL');
  let html = `<div class="card" style="border-color: var(--violet); background: linear-gradient(135deg, rgba(145, 70, 255, 0.08) 0%, rgba(24, 24, 27, 0.8) 60%);"><div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;"><span style="font-size:20px;">🎯</span><span class="card-matiere">Tri smart par urgence + matière faible</span></div><div class="contenu">Algo : combine la <b>date de remise</b> et tes <b>moyennes</b> pour mettre en haut ce qui compte le plus.</div></div>`;
  if (urg.length) { html += `<div class="section-titre"><h2>Urgent</h2><span class="count" style="background:rgba(237,66,69,0.15); color:var(--red); border-color:rgba(237,66,69,0.4);">${urg.length}</span><span class="ligne"></span></div>`; urg.forEach(p => html += cardPrio(p, 'urgent')); }
  if (imp.length) { html += `<div class="section-titre"><h2>Important</h2><span class="count" style="background:rgba(254,231,92,0.12); color:var(--yellow); border-color:rgba(254,231,92,0.3);">${imp.length}</span><span class="ligne"></span></div>`; imp.forEach(p => html += cardPrio(p, 'important')); }
  if (nor.length) { html += `<div class="section-titre"><h2>Normal</h2><span class="count">${nor.length}</span><span class="ligne"></span></div>`; nor.forEach(p => html += cardPrio(p, 'normal')); }
  document.getElementById('prioritesListe').innerHTML = html;
}
function cardPrio(p, cls) {
  const moyColor = p.moyenne_matiere == null ? 'var(--text-mute)' : p.moyenne_matiere >= 14 ? 'var(--green)' : p.moyenne_matiere >= 10 ? 'var(--yellow)' : 'var(--red)';
  const moy = (p.moyenne_matiere != null) ? `<span style="font-size:11px; font-family:'JetBrains Mono'; color:var(--text-mute); margin-left:8px;">avg: <b style="color:${moyColor}">${p.moyenne_matiere}/20</b></span>` : '';
  const j = p.jours_restants;
  let r;
  if (j < 0) r = `<span class="badge urgent">⚠ EN RETARD ${-j}J</span>`;
  else if (j === 0) r = `<span class="badge urgent">● AUJOURD'HUI</span>`;
  else if (j === 1) r = `<span class="badge demain">▸ DEMAIN</span>`;
  else r = `<span class="badge ${cls}">▸ DANS ${j}J</span>`;
  return `<div class="card ${cls}"><div class="card-head"><div style="flex:1"><div class="card-matiere">${escapeHtml(p.matiere)}</div>${r}${moy}</div><div class="card-meta"><div class="card-date">${fmtJour(new Date(p.date_remise))}</div></div></div><div class="contenu">${escapeHtml(p.contenu || '')}</div></div>`;
}

/* ---- NOTES ---- */
function renderNotes() {
  const n = DATA.notes || [];
  if (n.length === 0) { document.getElementById('notesListe').innerHTML = `<div class="empty"><div class="icon">📊</div>Aucune note</div>`; return; }
  let h = '';
  n.slice(0, 60).forEach(no => {
    const v = parseFloat(String(no.note).replace(',', '.'));
    const s = parseFloat(no.sur) || 20;
    const r = !isNaN(v) ? (v / s * 20) : null;
    const c = r === null ? '' : r >= 14 ? 'bonne' : r >= 10 ? 'moyenne' : 'basse';
    h += `<div class="note-card"><div><div class="note-matiere">${escapeHtml(no.matiere)}</div><div class="note-devoir">${escapeHtml(no.devoir || '')}</div></div><div class="note-date">${fmtJour(new Date(no.date))}</div><div class="note-valeur ${c}">${no.note}<small>/${no.sur}</small></div></div>`;
  });
  document.getElementById('notesListe').innerHTML = h;
}

function renderChart() {
  const m = ((DATA.priorites && DATA.priorites.moyennes) || []).filter(x => x.moyenne !== null);
  if (m.length === 0) return;
  new Chart(document.getElementById('chartMoyennes'), {
    type: 'bar',
    data: { labels: m.map(x => x.matiere), datasets: [{ label: '/20', data: m.map(x => x.moyenne), backgroundColor: m.map(x => x.moyenne >= 14 ? 'rgba(87, 242, 135, 0.7)' : x.moyenne >= 10 ? 'rgba(254, 231, 92, 0.7)' : 'rgba(237, 66, 69, 0.7)'), borderRadius: 6, borderWidth: 0 }] },
    options: { indexAxis: 'y', plugins:{legend:{display:false}, tooltip:{backgroundColor:'#1F1F23', titleColor:'#EFEFF1', bodyColor:'#ADADB8', borderColor:'#3F3F47', borderWidth:1}}, scales:{x:{beginAtZero:true, max:20, grid:{color:'rgba(63,63,71,0.5)'}, ticks:{color:'#ADADB8', font:{family:'JetBrains Mono'}}}, y:{grid:{display:false}, ticks:{color:'#EFEFF1', font:{family:'Inter', size:12, weight:600}}}} }
  });
}

setDateJour();
spawnParticles();
loadData();
</script>
</body>
</html>
